<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Reading Room — Documentary Case</title>
<style>
:root{--paper:#f7f4ee;--ink:#252720;--sub:#6a716c;--line:#d9d8d0;--green:#25594e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.75 Georgia,serif}a{color:var(--green);text-underline-offset:3px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:3px}
header{position:sticky;top:0;z-index:10;background:rgba(247,244,238,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}header .bar{margin:auto;max-width:1190px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;font:600 13px/1.4 system-ui,sans-serif}header a{text-decoration:none;color:var(--ink)}.toggle{display:flex;gap:12px;align-items:center}.toggle a{font-weight:400;border-bottom:2px solid transparent;padding:4px 0}.toggle a[aria-current="page"]{border-color:var(--green);font-weight:700}
.layout{max-width:1190px;margin:auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:48px;padding:52px 24px 100px}aside{position:sticky;top:85px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:14px;border-right:1px solid var(--line);font:13px/1.5 system-ui,sans-serif}aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.17em;color:var(--sub);margin:0 0 16px}aside a{display:block;padding:7px 9px;color:#545b55;text-decoration:none;border-left:2px solid transparent}aside a:hover{background:#eeebe4;color:var(--green)}.controls{margin:0 0 24px}input{width:100%;padding:10px 12px;border:1px solid #bcbfb6;background:white;border-radius:3px;font:14px system-ui,sans-serif}
main{min-width:0;max-width:790px}.overline{font:700 11px/1.5 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:14px}.intro{padding-bottom:35px;margin-bottom:25px;border-bottom:1px solid var(--line)}.intro h1{font-weight:400;font-size:clamp(31px,4vw,49px);line-height:1.12;letter-spacing:-.035em;margin:0 0 16px}.intro p{margin:0;color:var(--sub);font-size:15px}
.article h1,.article h2,.article h3,.article h4{line-height:1.32;letter-spacing:-.015em;scroll-margin-top:86px}.article h1{font-size:35px;font-weight:400}.article h2{font-size:26px;font-weight:400;border-top:1px solid var(--line);padding-top:25px;margin-top:45px}.article h3{font-size:20px;margin-top:28px}.article p{margin:16px 0}.article blockquote{margin:22px 0;border-left:3px solid #a9b7ae;padding:7px 0 7px 19px;color:#424a45}.article pre{overflow-x:auto;padding:16px;border:1px solid var(--line);background:white;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.article code{font-size:.87em}.article table{border-collapse:collapse;display:block;overflow-x:auto}.article th,.article td{border:1px solid var(--line);padding:9px 12px;text-align:left;font-size:14px}.article ul,.article ol{padding-left:24px}.article li{margin-bottom:8px}.article hr{border:0;border-top:1px solid var(--line);margin:35px 0}.status{font:13px system-ui,sans-serif;color:var(--sub)}.download{display:inline-block;margin-top:20px;font:600 13px system-ui,sans-serif}
@media(max-width:800px){.layout{grid-template-columns:1fr;padding-top:25px;gap:20px}aside{position:static;max-height:220px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}header .bar{flex-wrap:wrap}}@media print{header,aside{display:none}.layout{display:block;padding:0}main{max-width:none}.article h2{break-after:avoid}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head><body>
<header><div class="bar"><a href="./">← Documentary Case</a><nav class="toggle" aria-label="Reading editions"><a id="expertLink" href="reader.html?document=expert">Expert questions</a><a id="orientationLink" href="reader.html?document=orientation">Counsel orientation</a><a id="masterLink" href="reader.html?document=master">Master case</a></nav></div></header>
<div class="layout"><aside><h2>In this document</h2><div class="controls"><input id="find" type="search" aria-label="Filter headings" placeholder="Find a section"></div><nav id="toc" aria-label="Section contents"></nav></aside>
<main><div class="intro"><div class="overline">Independent counsel · Reading room</div><h1 id="pageTitle">Preparing document</h1><p id="description">The original file is retained unchanged. This page presents a readable edition for navigation.</p><a id="download" class="download" href="#">Download original Markdown ↓</a></div><article class="article" id="body"><p class="status" role="status">Loading…</p></article></main></div>
<script>
(async()=>{
const requested=new URLSearchParams(location.search).get('document');const chosen=['master','expert'].includes(requested)?requested:'orientation';
const files={expert:{file:'INDEPENDENT_EXPERT_QUESTION_SET_FINAL.md',title:'Independent Clinical Expert Questions',description:'Fifteen independent neurological questions, all 56 matters mapped, and the July 2017 clinical thresholds, including the 10 July bedside protest.'},orientation:{file:'Orientation_for_Counsel_Rewritten(1).md',title:'The Unanswered Referral and the Authority of the Record',description:'Counsel orientation and all 56 investigative matters, kept separate from the documentary evidence.'},master:{file:'Master_Documentary_Case_and_Counsel_Orientation.md',title:'Master Documentary Case and Counsel Orientation',description:'Consolidated working text, combining documentary material and the orientation with source distinctions retained.'}};
const d=files[chosen];document.title=d.title+' — Reading Room';document.querySelector('#pageTitle').textContent=d.title;document.querySelector('#description').textContent=d.description;document.querySelector('#download').href=encodeURI(d.file);document.querySelector('#'+chosen+'Link').setAttribute('aria-current','page');
const root=document.querySelector('#body'),toc=document.querySelector('#toc'),find=document.querySelector('#find');
try{
const r=await fetch(encodeURI(d.file));if(!r.ok)throw Error('File unavailable ('+r.status+')');const source=await r.text();
if(window.marked&&window.DOMPurify){window.marked.setOptions({gfm:true,breaks:false});root.innerHTML=window.DOMPurify.sanitize(window.marked.parse(source),{USE_PROFILES:{html:true}})}
else{const pre=document.createElement('pre');pre.textContent=source;root.replaceChildren(pre);document.querySelector('#description').textContent+=' (Plain-text fallback.)'}
const used=new Map();const headings=[...root.querySelectorAll('h1,h2,h3')];headings.forEach(h=>{
const base=(h.textContent||'section').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,75)||'section';const num=used.get(base)||0;used.set(base,num+1);h.id=num?base+'-'+(num+1):base;
const a=document.createElement('a');a.href='#'+encodeURIComponent(h.id);a.textContent=h.textContent;a.dataset.title=h.textContent.toLowerCase();a.style.paddingLeft=h.tagName==='H3'?'18px':'9px';toc.append(a);
});
find.addEventListener('input',()=>{const q=find.value.trim().toLowerCase();[...toc.querySelectorAll('a')].forEach(a=>a.hidden=!a.dataset.title.includes(q))});
if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)target.scrollIntoView()}
}catch(err){root.textContent='This document could not be loaded: '+err.message}
})();
</script></body></html>
